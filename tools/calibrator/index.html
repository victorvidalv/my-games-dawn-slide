<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAWNSLIDE · Calibrador</title>
<style>
:root{--bg:#14101f;--card:#211a33;--line:#3a2f55;--gold:#f0cf86;--ok:#4fd1a1;--tut:#ffb454;--boss:#d95b43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#efe6ff;font:13px/1.35 system-ui,sans-serif;padding:12px}
h1{margin:0;font-size:21px;color:var(--gold)}p.s{margin:2px 0 8px;color:#bfb2dd}
.bar{position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
button{background:#3b2b66;color:#fff;border:1px solid #6b52b8;border-radius:8px;padding:6px 11px;font:inherit;cursor:pointer}button:hover{background:#4d3a85}button.primary{background:#1f7a5a;border-color:#4fd1a1}button.primary:hover{background:#27946f}
#saved{color:var(--ok);min-width:90px}
svg#chart{width:100%;max-width:1100px;height:150px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0}
table{border-collapse:collapse;width:100%;max-width:1400px}th,td{border:1px solid var(--line);padding:0;text-align:center}
th{position:sticky;top:46px;background:#2a2040;z-index:5;padding:5px 3px;font-size:11px}
td.lv{width:46px;font-weight:800;background:var(--card)}tr.boss td.lv{background:var(--boss);color:#fff}tr.dec td{border-bottom:3px solid #6b52b8}
td.c{width:46px;height:30px;cursor:pointer;user-select:none;font-size:16px}td.c:hover{outline:2px solid var(--gold);outline-offset:-2px}
td.s1{background:#1d4a3c;color:var(--ok)}td.s2{background:#5a3a10;color:var(--tut);font-weight:900}td.add{background:#183a66;color:#7ab8ff}td.del{background:#4a1c1c;color:#ff9a8a}
td.n input{width:48px;background:#0e0a18;color:#ffe08a;border:1px solid #5b4a8a;border-radius:6px;padding:3px;text-align:center;font:inherit;font-weight:700}
td.n.ch input{border-color:var(--tut);background:#2a1d08}
td.calc{font-size:11px;color:#cdbff0;white-space:nowrap;padding:0 5px}td.calc b{color:#fff}
td.fam{text-align:left;font-size:11px;padding:0 6px;color:#cdbff0;min-width:120px}td.warn{text-align:left;font-size:11px;color:#ff9a8a;padding:0 6px;min-width:130px}
td.note input{width:140px;background:#0e0a18;color:#ddd;border:1px solid #3a2f55;border-radius:6px;padding:3px;font:inherit}
.grp{background:#33264f}
</style>
<h1>Calibrador · mecánicas, turnos mínimos y puntos</h1>
<p class="s">Clic en una celda de mecánica: vacío → ✓ aparece → ★ tutorial aparte → vacío. Los <b>mínimos</b> se editan por camino; límite y puntos se calculan con las fórmulas reales del juego. Todo se guarda solo (SQLite) y en <code>calibration.json</code>.</p>
<div class="bar"><button id="tabPref" class="primary">✏️ Preferencias</button><button id="tabRes">🔍 Verificar resultado</button><span style="width:14px"></span><button id="save" class="primary">💾 Guardar</button><button id="clear">🧹 Limpiar</button><span id="saved"></span><button id="reset">Volver al calendario actual del juego</button><span style="color:#bfb2dd" id="stats"></span></div>
<svg id="chart" viewBox="0 0 1000 150" preserveAspectRatio="none"></svg>
<table id="t"></table>
<div id="res" hidden></div>
<script type="module">
import { moveLimit, targetFor } from '/src/engine/difficulty.js';
import { calcGain } from '/src/engine/scoring.js';
import { bossCapFor } from '/src/game/bosses.js';
const MECH=[['wall','Roca','🪨'],['heavy','Pesada','⚖️'],['gate','Candado','🔒'],['ice','Hielo','❄️'],['door','Portón','🚪'],['curse','Maleficio','🌀'],['seal1','Sello bronce','🥉'],['seal2','Sello plata','🥈'],['seal3','Sello oro','🥇']];
const PATHS=[[1,'min_normal','Normal','#43e0c1'],[50,'min_hard','Difícil','#ffd24a'],[75,'min_expert','Experto','#ff7aa8']];
let rows=await (await fetch('/api/levels')).json();
const ratingOf=m=>{let best=1,d=1e9;for(let r=1;r<=100;r++){const x=Math.abs(targetFor(r)-m);if(x<d){d=x;best=r}}return best};
const fmt=n=>n.toLocaleString('es');
async function save(level,field,value){const r=await fetch('/api/level',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({level,field,value})});const j=await r.json();
  const s=document.getElementById('saved');s.textContent='✔ guardado';clearTimeout(save.t);save.t=setTimeout(()=>s.textContent='',1200);return j.value}
const famOf=r=>{const on=MECH.slice(0,5).filter(([id])=>r[id]).map(([,n])=>n);return on.length?on.join(' + '):'normal'};
function warns(i){const r=rows[i],w=[];const tut=MECH.filter(([id])=>r[id]===2);if(tut.length>1)w.push('2 tutoriales');
  for(const [id,n] of MECH.slice(0,6)){if(r[id]===1){const f=rows.findIndex(x=>x[id]===2);if(f>=0&&f>i)w.push(n+' antes de su tutorial')}}
  const seals=MECH.slice(6).filter(([id])=>r[id]).length;if(seals>1)w.push('2 sellos');
  if(r.level%10===0&&(r.curse||seals))w.push('giro/sello en jefe');
  for(const [,k,n] of PATHS){if(i&&rows[i-1][k]>r[k]+3&&r.level%10!==1)w.push('baja de golpe en '+n)}
  return w.join(' · ')}
function draw(){
  const t=document.getElementById('t');
  t.innerHTML='<tr><th>Nivel</th>'+MECH.map(([,n,e])=>`<th>${e}<br>${n}</th>`).join('')
   +PATHS.map(([,,n,c])=>`<th style="color:${c}">Mín.<br>${n}</th>`).join('')
   +PATHS.map(([,,n,c])=>`<th class="grp" style="color:${c}">${n}<br>límite · pts perfecto</th>`).join('')+'<th>Tablero</th><th>Avisos</th><th>Nota</th></tr>'
  +rows.map((r,i)=>{
    const boss=r.level%10===0;
    const calc=PATHS.map(([s,k])=>{const m=r[k],rt=ratingOf(m),lim=moveLimit(m,s,r.level,false,boss?bossCapFor(r.level):false);return `<td class="calc"><b>${lim}</b> · ${fmt(calcGain(rt,m,m,0).total)}</td>`}).join('');
    return `<tr class="${boss?'boss ':''}${boss?'dec':''}"><td class="lv">${r.level}${boss?' ☠':''}</td>`
     +MECH.map(([id])=>`<td class="c s${r[id]}" data-l="${r.level}" data-f="${id}">${r[id]===2?'★':r[id]===1?'✓':''}</td>`).join('')
     +PATHS.map(([,k])=>`<td class="n"><input type="number" min="1" max="99" value="${r[k]}" data-l="${r.level}" data-f="${k}"></td>`).join('')
     +calc+`<td class="fam">${famOf(r)}${r.curse?' · girado':''}</td><td class="warn">${warns(i)}</td>`
     +`<td class="note"><input value="${(r.note||'').replace(/"/g,'&quot;')}" data-l="${r.level}" data-f="note"></td></tr>`}).join('');
  chart();
  document.getElementById('stats').textContent=`Mecánicas: ${MECH.map(([id,n])=>rows.filter(r=>r[id]).length+' '+n.toLowerCase()).join(' · ')}`;
}
function chart(){const svg=document.getElementById('chart');const W=1000,H=150,P=14;const X=l=>P+(l-1)*(W-2*P)/99,Y=v=>H-P-(v/40)*(H-2*P);
  let s='';for(const v of [10,20,30,40])s+=`<line x1="${P}" x2="${W-P}" y1="${Y(v)}" y2="${Y(v)}" stroke="#3a2f55"/><text x="2" y="${Y(v)-2}" fill="#8f82b3" font-size="9">${v}</text>`;
  for(let l=10;l<=100;l+=10)s+=`<line x1="${X(l)}" x2="${X(l)}" y1="${P}" y2="${H-P}" stroke="#d95b4355"/>`;
  for(const [,k,n,c] of PATHS)s+=`<polyline fill="none" stroke="${c}" stroke-width="2" points="${rows.map(r=>X(r.level)+','+Y(Math.min(40,r[k]))).join(' ')}"><title>${n}</title></polyline>`;
  svg.innerHTML=s}
document.getElementById('t').addEventListener('click',async e=>{const c=e.target.closest('td.c');if(!c)return;const r=rows.find(x=>x.level==c.dataset.l),f=c.dataset.f;const v=(r[f]+1)%3;r[f]=await save(r.level,f,v);draw()});
document.getElementById('t').addEventListener('change',async e=>{const i=e.target.closest('input');if(!i)return;const r=rows.find(x=>x.level==i.dataset.l),f=i.dataset.f;r[f]=await save(r.level,f,f==='note'?i.value:+i.value);draw()});
/* ---------- Verificar: cómo quedó el juego tras `npm run calibrate` frente a tus preferencias ---------- */
const LET={wall:'w',heavy:'h',gate:'g',ice:'i',door:'d'};
async function showResult(){
  const box=document.getElementById('res');
  const r=await (await fetch('/api/result')).json();
  if(r.error){box.innerHTML='<p>'+r.error+'</p>';return}
  const T=r.tutorials,L=r.levels;let changes=0;
  const intro=new Set(Object.values(T));
  const body=rows.map((p,i)=>{
    const [m,curse,seal,sealTut,mn,mh,me]=L[i];const boss=p.level%10===0;const notes=[];
    const cells=['wall','heavy','gate','ice','door'].map(k=>{const was=p[k]>0,now=m.includes(LET[k]);const tut=T[k]===p.level;
      if(was!==now){changes++;notes.push((now?'+':'−')+k)}
      return `<td class="c ${now&&was?'s1':now?'add':was?'del':''}">${tut?'★':now?'✓':was?'✗':''}</td>`}).join('');
    const prefCurse=p.curse>0,cs=curse===1;if(prefCurse!==cs){changes++;notes.push(cs?'+giro':'−giro')}
    const prefSeal=p.seal3?3:p.seal2?2:p.seal1?1:0;if(prefSeal!==seal){changes++;notes.push('sello '+prefSeal+'→'+seal)}
    const mins=[[mn,p.min_normal],[mh,p.min_hard],[me,p.min_expert]];
    const minCells=mins.map(([a,b])=>`<td class="n ${a!==b?'ch':''}">${a}${a!==b?` <s style="color:#8f82b3">${b}</s>`:''}</td>`).join('');
    const calc=[1,50,75].map((s,k)=>{const mm=mins[k][0],rt=ratingOf(mm);return `<td class="calc"><b>${moveLimit(mm,s,p.level,false,boss?bossCapFor(p.level):false)}</b> · ${fmt(calcGain(rt,mm,mm,0).total)}</td>`}).join('');
    const fam=m?[...m].map(c=>Object.keys(LET).find(k=>LET[k]===c)).join(' + '):'normal';
    return `<tr class="${boss?'boss dec':''}"><td class="lv">${p.level}${boss?' ☠':''}</td>${cells}<td class="c ${cs&&prefCurse?'s1':cs?'add':prefCurse?'del':''}">${p.level===T.curse?'★':cs?'🌀':prefCurse?'✗':''}</td>`
      +`<td class="c ${seal&&prefSeal===seal?'s1':seal?'add':prefSeal?'del':''}">${seal?['🥉','🥈','🥇'][seal-1]+(sealTut?'★':''):prefSeal?'✗':''}</td>${minCells}${calc}<td class="fam">${fam}${cs?' · girado':''}</td><td class="warn" style="color:#ffd89a">${notes.join(' · ')}</td></tr>`}).join('');
  box.innerHTML=`<p class="s">Así quedó el juego (<code>src/data/calibration.json</code>). <span style="color:var(--ok)">verde</span> = como pediste · <span style="color:#7ab8ff">azul</span> = lo añadió el optimizador · <span style="color:#ff9a8a">✗ rojo</span> = lo quitó. Mínimos: valor final y, tachado, tu preferencia. <b>${changes}</b> diferencias con tus marcas. Tutoriales: ${Object.entries(T).map(([k,v])=>k+' '+v).join(' · ')}.</p>`
   +`<table><tr><th>Nivel</th>${MECH.slice(0,5).map(([,n,e])=>`<th>${e}<br>${n}</th>`).join('')}<th>🌀<br>Maleficio</th><th>Sello</th>`
   +PATHS.map(([,,n,c])=>`<th style="color:${c}">Mín.<br>${n}</th>`).join('')+PATHS.map(([,,n,c])=>`<th class="grp" style="color:${c}">${n}<br>límite · pts</th>`).join('')+`<th>Tablero final</th><th>Cambios</th></tr>${body}</table>`;
}
const tabs=(pref)=>{document.getElementById('t').hidden=!pref;document.getElementById('res').hidden=pref;document.getElementById('tabPref').classList.toggle('primary',pref);document.getElementById('tabRes').classList.toggle('primary',!pref);document.getElementById('chart').style.display=pref?'':'none'};
document.getElementById('tabPref').onclick=()=>tabs(true);
document.getElementById('tabRes').onclick=async()=>{await showResult();tabs(false)};
document.getElementById('save').onclick=async()=>{const j=await (await fetch('/api/save',{method:'POST'})).json();const s=document.getElementById('saved');s.textContent=`💾 Guardado ${new Date(j.saved_at).toLocaleTimeString('es')} · versión ${j.versions}`;clearTimeout(save.t)};
document.getElementById('clear').onclick=async()=>{if(!confirm('¿Limpiar todas las marcas de mecánicas, maleficio, sellos y notas? Los turnos mínimos se conservan.'))return;await fetch('/api/clear',{method:'POST'});rows=await (await fetch('/api/levels')).json();draw()};
document.getElementById('reset').onclick=async()=>{if(!confirm('¿Descartar tus cambios y volver al calendario actual del juego?'))return;await fetch('/api/reset',{method:'POST'});rows=await (await fetch('/api/levels')).json();draw()};
draw();
</script></html>
