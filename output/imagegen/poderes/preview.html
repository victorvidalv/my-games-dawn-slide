<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poderes de Jean y Van · 25 cuadros</title>
<style>
  *{box-sizing:border-box}body{margin:0;padding:32px 16px;background:#10242e;color:#f0e5ce;font-family:system-ui,sans-serif;text-align:center}h1{font:28px Georgia,serif;margin:0 0 12px}p{color:#bbcad1}main{display:flex;justify-content:center;gap:32px;flex-wrap:wrap;margin:28px auto}figure{margin:0}img{display:block;width:144px;height:288px;border-radius:12px;box-shadow:0 0 24px #8fd3ef33}figcaption{margin-top:12px;font:20px Georgia,serif}button{padding:12px 24px;border:1px solid #b7cfe2;border-radius:8px;color:#f0e5ce;background:#294555;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #f0cf7a;outline-offset:4px}
</style>
<h1>Jean y Van · Poderes</h1>
<p>25 cuadros por héroe · 60 ms por cuadro · 1,5 segundos</p>
<main>
  <figure><img id="jean" src="../../../public/heroes/jean-power.gif" alt="Jean activa su reloj con magia cian"><figcaption>Jean · Rebobinar</figcaption></figure>
  <figure><img id="van" src="../../../public/heroes/van-power.gif" alt="Van traza una constelación violeta sobre su libro"><figcaption>Van · Trazar destino</figcaption></figure>
</main>
<button type="button" id="replay">Reproducir ambos</button>
<script>
  document.getElementById('replay').addEventListener('click', () => {
    for (const hero of ['jean','van']) {
      document.getElementById(hero).src = `../../../public/heroes/${hero}-power.gif?replay=${Date.now()}`;
    }
  });
</script>
</html>
